version: '3.8'

services:
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: enterprise_memory_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./data:/app/data

  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: enterprise_memory_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://memory-api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - memory-api
